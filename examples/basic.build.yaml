schema: sputnik.build.v1
name: sqlite3.example
root: sqlite3.example

profiles:
  required: [core.v1, ffi.v1, macro.v1]
  optional: []
  forbidden: []

modules:
  - name: sqlite3
    path: ../src/sqlite3.s
  - name: sqlite3.example
    path: basic.s

native_extensions:
  - name: sqlite3
    language: c
    sources:
      - ../native/sqlite3_ext.c
      - ../native/sqlite3.c
    headers:
      - ../native/sqlite3.h
    blocking_symbols:
      - amsq_pool_acquire_wait
    defines:
      - SQLITE_THREADSAFE=1
      - SQLITE_ENABLE_COLUMN_METADATA=1
      - SQLITE_ENABLE_FTS5=1
      - SQLITE_ENABLE_JSON1=1
      - SQLITE_DQS=0
      - SQLITE_OMIT_LOAD_EXTENSION=1
