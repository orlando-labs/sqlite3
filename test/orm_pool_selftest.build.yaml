schema: amber.build.v1
name: sqlite3.orm_pool_selftest
root: sqlite3.orm_pool_selftest

profiles:
  required: [core.v1, ffi.v1, macro.v1]
  optional: []
  forbidden: []

modules:
  - name: sqlite3
    path: ../src/sqlite3.am
  - name: orm
    path: ../../amber-orm/src/orm.am
  - name: orm.sqlite3
    path: ../../amber-orm/src/orm/sqlite3.am
  - name: sqlite3.orm_pool_selftest
    path: orm_pool_selftest.am

native_extensions:
  - name: sqlite3
    language: c
    sources:
      - ../native/sqlite3_ext.c
      - ../native/sqlite3.c
    headers:
      - ../native/sqlite3.h
    defines:
      - SQLITE_THREADSAFE=1
      - SQLITE_ENABLE_COLUMN_METADATA=1
      - SQLITE_ENABLE_FTS5=1
      - SQLITE_ENABLE_JSON1=1
      - SQLITE_DQS=0
      - SQLITE_OMIT_LOAD_EXTENSION=1
